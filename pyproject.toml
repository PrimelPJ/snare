[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snare"
version = "0.1.0"
description = "Cloud honeypot with a live threat map, shipping to Azure Log Analytics and Sentinel"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Primel Jayawardana" }]
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "asyncssh>=2.14",
]

[project.optional-dependencies]
azure = ["azure-monitor-ingestion>=1.0", "azure-identity>=1.15"]
geoip = ["maxminddb>=2.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
snare = "snare.__main__:cli"

[tool.setuptools.packages.find]
include = ["snare*"]

[tool.setuptools.package-data]
snare = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
